<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 64" width="272" height="64" role="img" aria-labelledby="wirabaja-logo-lengkap-title">
  <title id="wirabaja-logo-lengkap-title">Logo PT Wirabaja Mesin Nusantara</title>
  <!-- Lambang segi enam baut baja dengan potongan diagonal sudut kanan atas -->
  <g>
    <path d="M 32 4 L 48.5 13 L 56.5 21.5 L 56.5 45.5 L 32 60 L 7.5 45.5 L 7.5 18.5 Z" fill="none" stroke="#0B1F3A" stroke-width="3.2" stroke-linejoin="miter" />
    <path d="M 49.5 10.2 L 59.2 20 L 56.5 22 L 47.4 12.8 Z" fill="#FFB400" />
    <!-- Huruf W dibentuk dari sepasang lengan excavator (boom dan stick) -->
    <path d="M 13.5 19.5 L 19 19.5 L 25.2 35.4 L 20.2 37.2 Z" fill="#0B1F3A" />
    <path d="M 21 35 L 29.8 22.5 L 33.4 24.4 L 24.8 37.2 Z" fill="#0B1F3A" />
    <path d="M 43 35 L 34.2 22.5 L 30.6 24.4 L 39.2 37.2 Z" fill="#0B1F3A" />
    <path d="M 50.5 19.5 L 45 19.5 L 38.8 35.4 L 43.8 37.2 Z" fill="#0B1F3A" />
    <!-- Sendi engsel lengan excavator berwarna kuning -->
    <circle cx="22.6" cy="36.2" r="3.5" fill="#FFB400" />
    <circle cx="22.6" cy="36.2" r="1.3" fill="#0B1F3A" />
    <circle cx="41.4" cy="36.2" r="3.5" fill="#FFB400" />
    <circle cx="41.4" cy="36.2" r="1.3" fill="#0B1F3A" />
    <circle cx="32" cy="23.8" r="2.2" fill="#FFB400" />
    <!-- Gigi bucket kuning di ujung bawah tengah -->
    <path d="M 29.2 36.5 L 34.8 36.5 L 33.4 42.4 L 32 44.2 L 30.6 42.4 Z" fill="#FFB400" />
    <!-- Garis punggung pegunungan Nusantara di dasar lambang -->
    <path d="M 16 49 L 22.5 45.2 L 28 49.4 L 32 47.2 L 36 49.4 L 41.5 45.2 L 48 49" fill="none" stroke="#0B1F3A" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" opacity="0.72" />
  </g>
  <!-- Tulisan utama dan subjudul perusahaan -->
  <g>
    <text x="74" y="36" fill="#0B1F3A" font-family="&#39;Barlow Condensed&#39;, &#39;Arial Narrow&#39;, &#39;Roboto Condensed&#39;, sans-serif" font-size="31" font-weight="800" letter-spacing="2.2">WIRABAJA</text>
    <rect x="74" y="45" width="18" height="2.6" fill="#FFB400" />
    <text x="98" y="50" fill="#4A596D" font-family="&#39;Public Sans&#39;, &#39;Segoe UI&#39;, Arial, sans-serif" font-size="11.2" font-weight="600" letter-spacing="2.4">MESIN NUSANTARA</text>
  </g>
</svg>